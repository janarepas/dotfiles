[window]
opacity = 0.9
dynamic_padding = true
padding.x = 2
padding.y = 2
dimensions = { columns = 120, lines = 30 }

[cursor.style]
shape = "Beam"
blinking = "Never"

[env]
TERM = "xterm-256color"

[font]
size = 14.0
normal.family = "MesloLGS Nerd Font Mono"
normal.style = "Regular"

[font.bold]
family = "MesloLGS Nerd Font Mono"
style = "Bold"

[font.italic]
family = "MesloLGS Nerd Font Mono"
style = "Italic"

